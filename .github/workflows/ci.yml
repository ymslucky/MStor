name: CI

on:
  push:
    # 仓库主分支是 master；此前只监听 main，导致 push 从未触发过 CI（质量门禁实际只覆盖 PR）
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 生产运行时依赖不允许存在未豁免的 moderate 及以上漏洞。
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:ci
      - run: npm run check
      # 服务端本地集成测试：node:sqlite 垫片直接调用生产函数，覆盖删除/移动/配额/孤儿清扫。
      - run: npm run test:server:local
      # Prettier 门禁待一次独立的行尾归一化提交后启用，避免本 PR 混入无关全量格式化 diff。
